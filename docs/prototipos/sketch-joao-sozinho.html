.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--vazio);border-right:1px solid var(--rule);padding:28px 18px 24px;display:flex;flex-direction:column;gap:26px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:12px;padding:0 6px}
.brand .gmark{width:96px}
.pname{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.pname small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.22em;color:var(--label);margin-bottom:6px}
.store{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;flex:none;border:1px solid var(--rule-strong)}
.store b{display:block;font-size:13.5px;font-weight:600}
.store span{font-size:12px;color:var(--label)}
.linked{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--label);padding:0 6px}
.linked i{width:22px;height:10px;border:1.5px solid var(--bone);border-radius:2px;flex:none}
.linked i.off{border:1px dotted var(--sombra)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;background:none;border:0;border-radius:8px;padding:9px 8px;text-align:left;cursor:pointer;color:var(--label)}
.steps button:hover{background:var(--hover)}
.steps button[aria-current="page"]{background:rgba(242,239,231,.1);color:var(--ink)}
.steps .k{font-family:var(--mono);font-size:11px}
.steps .t{font-size:14px;line-height:1.3}
.steps .done .k::after{content:" ✓"}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.demo{display:inline-flex;align-self:flex-start;border:1px dashed var(--rule-strong);border-radius:999px;padding:4px 10px}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule)}
.crumbs{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.crumbs .t{font-family:var(--display);font-weight:600;font-size:15px}
.btn{background:transparent;border:1px solid var(--rule-strong);border-radius:999px;padding:9px 16px;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.solid{background:var(--bone);color:var(--carvao);border-color:var(--bone)}
.btn.solid:hover{background:var(--piedra)}
.btn[disabled]{opacity:.35;cursor:default}
.screen{padding-block:36px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1120px;width:100%;flex:1}
.screen h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,42px);line-height:1.04;margin:8px 0 10px;text-wrap:balance;letter-spacing:-.005em}
.screen .sub{margin:0 0 28px;color:var(--label);max-width:64ch;font-size:15.5px}
.say{font-family:var(--serif);font-weight:400;font-size:clamp(20px,2.2vw,26px);line-height:1.3;margin:0;text-wrap:balance}
.next-row{display:flex;justify-content:flex-end;gap:10px;margin-top:32px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.box{border:1px solid var(--rule);border-radius:14px;padding:20px;background:var(--deep);display:flex;flex-direction:column;gap:12px;min-width:0}
.box.fato{border:1.6px solid var(--bone)}
.box.hip{border:1.6px dashed var(--bone)}
.box.vaz{border:1px dotted var(--sombra);background:transparent}
.box.garg{border:1.6px solid var(--bone);position:relative;overflow:hidden}
.box.garg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-48deg,rgba(242,239,231,.1) 0 1.5px,transparent 1.5px 9px);pointer-events:none}
.box.garg>*{position:relative}
.box h3{margin:0;font-family:var(--display);font-weight:600;font-size:19px}
.box p{margin:0;font-size:14.5px;color:var(--soft)}
.state{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* chat */
.chat{border:1px solid var(--rule-strong);border-radius:18px;padding:16px;background:#1B1917;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.5}
.msg.tool{align-self:flex-start;background:var(--panel);border-radius:14px 14px 14px 4px}
.msg.me{align-self:flex-end;background:var(--wa);color:var(--wa-ink);border-radius:14px 14px 4px 14px}
.audio{display:flex;align-items:center;gap:12px}
.audio button{width:36px;height:36px;border-radius:50%;border:0;background:var(--carvao);color:var(--bone);cursor:pointer;display:grid;place-items:center;flex:none}
.wave{display:flex;gap:3px;align-items:center;height:26px}
.wave i{width:3px;border-radius:2px;background:var(--carvao);opacity:.7}
.msg.tool .wave i{background:var(--bone)}
.shot{width:140px;height:180px;border-radius:10px;border:1px dashed var(--carvao);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:11px;color:var(--wa-ink);background:repeating-linear-gradient(-48deg,rgba(42,39,36,.08) 0 1.5px,transparent 1.5px 8px)}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.import{display:flex;gap:16px;align-items:center;border:1.6px solid var(--bone);border-radius:14px;padding:18px;background:var(--deep)}
.import b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}

/* persona + quotes */
.persona{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.quote{font-family:var(--serif);font-size:clamp(24px,2.6vw,32px);line-height:1.2;margin:0}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px}
.bar .t{display:flex;flex-direction:column;gap:5px}
.bar .track{height:10px;border-radius:999px;background:rgba(242,239,231,.08);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--bone);border-radius:999px}
.bar .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--label)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.trio div{border-top:2px solid var(--bone);padding-top:10px;font-size:14px;color:var(--soft)}
.trio b{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.18em;color:var(--label);margin-bottom:6px}

/* terrain matrix */
.mwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:14px;background:var(--deep)}
.matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.matrix th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--label);text-align:center;padding:14px 10px;vertical-align:bottom}
.matrix th:first-child{text-align:left}
.matrix td{border-top:1px solid var(--rule);padding:12px 10px;text-align:center}
.matrix td:first-child{text-align:left;font-weight:600}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--bone)}
.dot.no{background:transparent;border:1px dotted var(--sombra)}
.matrix .gap{background:repeating-linear-gradient(-48deg,rgba(242,239,231,.12) 0 1.5px,transparent 1.5px 9px);border-left:1.6px dashed var(--bone);border-right:1.6px dashed var(--bone)}
.matrix tr.you td{background:rgba(242,239,231,.06)}
.matrix tr.you td:first-child{color:var(--bone)}

/* channels */
.chan{cursor:pointer;text-align:left;color:var(--ink)}
.chan[aria-pressed="false"]{opacity:.55}
.chan .pick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.meter{display:flex;gap:4px}
.meter i{width:18px;height:6px;border-radius:2px;background:rgba(242,239,231,.15)}
.meter i.on{background:var(--bone)}
.traffic{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.grid3 .wide{grid-column:span 2}
.traffic .v{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}

/* missions */
.missions{display:flex;flex-direction:column;gap:10px}
.mission{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px;border:1px solid var(--rule);border-radius:12px;background:var(--deep);cursor:pointer;text-align:left;color:var(--ink);width:100%}
.mission .ck{width:22px;height:22px;border:1.5px solid var(--duna);border-radius:5px;display:grid;place-items:center}
.mission[aria-pressed="true"] .ck{background:var(--bone);border-color:var(--bone)}
.mission[aria-pressed="true"] .ck::after{content:"";width:10px;height:5px;border-left:2px solid var(--carvao);border-bottom:2px solid var(--carvao);transform:rotate(-45deg) translate(1px,-1px)}
.mission b{display:block;font-size:15px;font-weight:600}
.mission span{font-size:13.5px;color:var(--label)}
.signals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sig{border-top:2px solid var(--bone);padding:12px 2px 0;display:flex;flex-direction:column;gap:4px}
.sig .v{font-family:var(--display);font-weight:800;font-size:clamp(30px,3vw,40px);line-height:1}
.sig span{font-size:13px;color:var(--label)}
.cycle{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.cycle .node{border:1.6px solid var(--bone);border-radius:10px;padding:10px 14px;font-family:var(--display);font-weight:600}
.cycle .node.dash{border-style:dashed}
.cycle .arr{font-family:var(--mono);color:var(--label)}
.ready{border:1.6px solid var(--bone);border-radius:16px;padding:26px;background:var(--deep);display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--carvao);padding:10px 16px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;z-index:60}

@media (max-width:980px){.grid3 .wide{grid-column:auto}.grid3,.trio,.signals{grid-template-columns:minmax(0,1fr)}.persona,.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:16px max(16px,env(safe-area-inset-left,0px));gap:14px;border-right:0;border-bottom:1px solid var(--rule)}
  .brand{flex-direction:row;align-items:center;justify-content:space-between}
  .store,.rail-foot,.linked{display:none}
  .steps{flex-direction:row;overflow-x:auto;gap:4px}
  .steps button{grid-template-columns:auto auto;white-space:nowrap}
  .topbar,.screen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .traffic{grid-template-columns:minmax(0,1fr)}
  .mission{grid-template-columns:28px minmax(0,1fr)}
  .mission .tag2{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="gmark" role="img" aria-label="Símbolo Ground Project"></span><div class="pname"><small>Ground</small>Sketch</div></div>
    <div class="store"><div class="avatar">J</div><div><b>João · Brutal Wear</b><span>Roupa de treino · Instagram</span></div></div>
    <div class="linked"><i class="off"></i>Sem Marco Zero · Sketch sozinho</div>
    <nav aria-label="Telas"><ol class="steps" id="steps"></ol></nav>
    <div class="rail-foot"><span class="lbl demo">Demonstração · dados fictícios</span><span class="lbl" style="letter-spacing:.14em">Aquisição construída, não alugada</span></div>
  </aside>
  <main>
    <div class="topbar"><div class="crumbs"><span class="lbl" id="crumbN">01</span><span class="t" id="crumbT"></span></div><div style="display:flex;gap:8px"><button class="btn" id="prev" type="button">← Anterior</button><button class="btn solid" id="next" type="button">Próximo →</button></div></div>
    <div id="view" class="screen"></div>
  </main>
</div>
<div id="toastHost"></div>
<script>
const P={
 rail:{who:'João · Brutal Wear',what:'Roupa de treino · Instagram',av:'J',linked:false},
 onChan(){const n=Object.values(STATE.chan).filter(v=>v===false).length;const el=document.getElementById('chanCount');if(el)el.textContent=(4-n)+' de 4 canais no plano'},
 onMis(){const n=Object.values(STATE.done).filter(Boolean).length;const el=document.getElementById('misCount');if(el)el.textContent=n+' de 3 feitas'},
 screens:[
 {id:'entrada',n:'Entrada',html:()=>`
  <span class="lbl">Ground Sketch · sozinho</span>
  <h1>Sem base de clientes? A gente começa pela conversa.</h1>
  <p class="sub">O João vende umas dez peças por mês pelo Instagram. Não tem loja virtual nem lista de clientes. O Sketch parte do que ele sabe e do que o público dele já escreve.</p>
  <div class="grid2">
   <div class="chat">
    <div class="msg tool"><span class="lbl" style="display:block;margin-bottom:8px">Sketch</span>Me conta da sua marca do jeito que você contaria para um cliente. Pode mandar áudio e print.</div>
    <div class="msg me"><div class="audio"><button type="button" data-play="t1" aria-label="Ouvir áudio do João">${play}</button>${wave(26,5)}<span class="dur lbl" style="color:var(--wa-ink)">0:22</span></div><p id="t1" hidden style="margin:10px 0 0">“A minha camiseta não marca suor e dura muito. Tem cliente que usa há um ano.”</p></div>
    <div class="msg me"><div class="shots"><div class="shot"><b>Print 1</b>Comentários do post da camiseta preta</div><div class="shot"><b>Print 2</b>Direct de cliente pedindo outra cor</div></div></div>
    <div class="msg tool">Valeu. Vou ler os comentários do seu perfil e as avaliações de marcas parecidas.</div>
   </div>
   <div class="box vaz"><span class="state">Sem informação ainda</span><h3>Base de clientes</h3><p>Sem loja virtual e sem planilha. Tudo bem: o Sketch funciona sozinho. Quando a base existir, ela entra no plano.</p></div>
  </div>
  <div class="next-row"><button class="btn solid" type="button" data-go="1">Ver quem é o cliente →</button></div>`},
 {id:'cliente',n:'Quem é o cliente',html:()=>`
  <span class="lbl">Quem é o cliente · 186 comentários e 230 avaliações lidas</span>
  <h1>Ele está cansado de camiseta que desbota.</h1>
  <p class="sub">Comentários do Instagram do João e avaliações de marcas parecidas apontam para o mesmo perfil.</p>
  <div class="persona">
   <div class="box hip">
    <div class="row"><h3>Homem de 30 a 40 anos que faz crossfit</h3><span class="state">Hipótese forte</span></div>
    <p>Treina quatro a cinco vezes por semana, lava a roupa de treino toda hora e já trocou de marca por causa de tecido que não aguenta.</p>
    <p class="quote" style="margin-top:6px">“Lavou três vezes e acabou.”</p>
    <span class="lbl" style="letter-spacing:.12em">A reclamação mais citada sobre as outras marcas</span>
   </div>
   <div class="box"><span class="lbl">O que ele fala, nas palavras dele</span>${bars([['lavou três vezes e acabou',52],['desbotou rápido',37],['marca suor no peito',29],['estampa descascou',18]])}</div>
  </div>
  <div class="trio" style="margin-top:22px">
   <div><b>DOR</b>Pagar caro em camiseta que não dura o mês.</div>
   <div><b>DESEJO</b>Uma peça que aguenta o treino pesado e a máquina de lavar.</div>
   <div><b>MOTIVO DA COMPRA</b>Durabilidade comprovada, não visual agressivo.</div>
  </div>
  <div class="next-row"><button class="btn solid" type="button" data-go="2">Ver o terreno ao redor →</button></div>`},
 {id:'terreno',n:'O terreno ao redor',html:()=>`
  <span class="lbl">O terreno ao redor · 4 marcas disputam esse público</span>
  <h1>Todo mundo vende atitude. Quase ninguém fala de durabilidade.</h1>
  <p class="sub">A coluna hachurada é o espaço do João: a camiseta que aguenta o treino e a máquina de lavar.</p>
  ${matrix(['Visual agressivo','Atitude','Preço baixo','Durabilidade','Não marca suor'],[
    {n:'Rage Fit',v:[1,1,0,0,0]},{n:'Box Riot',v:[1,1,1,0,0]},{n:'Wod Kings',v:[1,1,0,0,1]},{n:'Grit Co.',v:[1,0,1,0,0]},
    {n:'Brutal Wear (você)',v:[0,1,0,1,1],you:true}],3)}
  <div class="grid2" style="margin-top:20px">
   <div class="box garg"><span class="state">Espaço vazio</span><h3>A camiseta que dura</h3><p>Nenhuma das quatro promete durabilidade. É exatamente a reclamação que o público mais faz.</p></div>
   <div class="box hip"><span class="state">Hipótese a testar</span><h3>“Aguenta o treino e a máquina de lavar”</h3><p>Testar primeiro no boca a boca dos boxes, antes de qualquer anúncio.</p></div>
  </div>
  <div class="next-row"><button class="btn solid" type="button" data-go="3">Ver onde ele está →</button></div>`},
 {id:'canais',n:'Onde ele está',html:()=>`
  <span class="lbl">Onde ele está · <span id="chanCount">4 de 4 canais no plano</span></span>
  <h1>Ele está no box do bairro.</h1>
  <p class="sub">Toque em um canal para tirar ou colocar no plano do mês.</p>
  <div class="grid3">
   ${[['boxes','Boxes de crossfit do bairro','6 boxes num raio de 5 km',4],['coaches','Coaches com influência local','Conectores: o aluno copia o que o coach veste',4],['grupos','Grupos de WhatsApp dos boxes','Onde os alunos combinam treino e campeonato',3],['camp','Campeonatos amadores','2 campeonatos no próximo mês',3]].map(([k,t,d,p])=>`<button type="button" class="box chan" data-chan="${k}" aria-pressed="${STATE.chan[k]!==false}"><div class="row"><h3>${t}</h3></div><p>${d}</p><div class="row">${meter(p)}<span class="pick">${STATE.chan[k]!==false?'No plano':'Fora do plano'}</span></div></button>`).join('')}
   <div class="box vaz traffic wide"><div><span class="lbl">Teste de tráfego · depois</span><div class="v num" style="color:var(--label)">R$ 200</div></div><p>Só quando a mensagem estiver validada no boca a boca. Por enquanto, fica de fora.</p></div>
  </div>
  <div class="next-row"><button class="btn solid" type="button" data-go="4">Ver o plano do mês →</button></div>`,after:()=>P.onChan()},
 {id:'plano',n:'Plano e missões',html:()=>`
  <span class="lbl">Plano de aquisição · novembro</span>
  <h1>Primeira semana: três missões.</h1>
  <p class="sub">Você sai com o plano e já dá os primeiros passos. Marque o que for fazendo: <b id="misCount" style="color:var(--ink)">0 de 3 feitas</b>.</p>
  <div class="missions">
   ${[['m1','Levar camisetas para dois coaches usarem nas aulas','Uma de cada cor. Peça só que contem quantas lavagens aguentou.','Conectores'],['m2','Gravar um vídeo lavando a camiseta pela décima vez','Antes e depois lado a lado. Roteiro de 30 segundos pronto.','Conteúdo'],['m3','Oferecer um kit para os vencedores de um campeonato amador','Três kits no campeonato do dia 30, com cartão e QR code.','Eventos']].map(([k,t,d,g])=>`<button type="button" class="mission" data-mis="${k}" aria-pressed="${!!STATE.done[k]}"><span class="ck" aria-hidden="true"></span><span><b>${t}</b><span>${d}</span></span><span class="lbl tag2">${g}</span></button>`).join('')}
  </div>
  <div class="box fato" style="margin-top:26px">
   <div class="row"><span class="lbl">Fim do mês · primeiros sinais</span><span class="state">Simulação</span></div>
   <div class="signals"><div class="sig"><span class="v num">31</span><span>mensagens recebidas</span></div><div class="sig"><span class="v num">6</span><span>indicações dos coaches</span></div><div class="sig"><span class="v num">14</span><span>vendas novas</span></div></div>
  </div>
  <p class="say" style="margin-top:30px">Você sai com o plano e já dá os primeiros passos.</p>
  <div class="next-row"><button class="btn solid" type="button" data-go="5">Três meses depois →</button></div>`,after:()=>P.onMis()},
 {id:'fecho',n:'Quando a base chega',html:()=>`
  <span class="lbl">Três meses depois · simulação</span>
  <h1>O João já tem uma base.</h1>
  <p class="sub">O Sketch acompanha as vendas e avisa quando faz sentido dar o próximo passo. Sem pressa e sem empurrar.</p>
  <div class="ready">
   <div class="signals"><div class="sig"><span class="v num">38</span><span>clientes com nome e contato</span></div><div class="sig"><span class="v num">7</span><span>já compraram duas vezes</span></div><div class="sig"><span class="v num">41</span><span>dias, em média, até a 2ª compra</span></div></div>
   <p class="say">Você já tem clientes voltando. O Marco Zero pode te mostrar quem está perto de recomprar.</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn solid" type="button" data-toast="Na versão real, abre a apresentação do Marco Zero">Conhecer o Marco Zero</button><button class="btn" type="button" data-toast="Tudo bem. O Sketch segue com você">Agora não, seguir com o Sketch</button></div>
  </div>
  <div class="cycle" style="margin-top:26px"><span class="node">Sketch traz o cliente certo</span><span class="arr">→</span><span class="node dash">Marco Zero faz ele voltar</span></div>`}
 ]};

/* engine: P = persona config with screens [{id,n,html(),after?()}] */
const $=s=>document.querySelector(s);
let cur=0, seen=new Set([0]);
const STATE={chan:{},done:{}};
function steps(){$('#steps').innerHTML=P.screens.map((s,i)=>`<li><button type="button" data-go="${i}" class="${seen.has(i)&&i!==cur?'done':''}" ${i===cur?'aria-current="page"':''}><span class="k">0${i+1}</span><span class="t">${s.n}</span></button></li>`).join('')}
function go(i,fromHash){
  const N=P.screens.length; cur=Math.max(0,Math.min(N-1,i)); seen.add(cur);
  if(!fromHash){try{history.replaceState(null,'','#'+P.screens[cur].id)}catch(e){}}
  $('#crumbN').textContent=`0${cur+1} / 0${N}`; $('#crumbT').textContent=P.screens[cur].n;
  $('#prev').disabled=cur===0; $('#next').textContent=cur===N-1?'Recomeçar →':'Próximo →';
  steps(); $('#view').innerHTML=P.screens[cur].html(); P.screens[cur].after?.(); window.scrollTo({top:0});
}
function toast(t){$('#toastHost').innerHTML=`<div class="toast" role="status">${t}</div>`;setTimeout(()=>{$('#toastHost').innerHTML=''},1800)}
function wave(n,seed){let s='';for(let i=0;i<n;i++){const h=6+((i*seed*7)%19);s+=`<i style="height:${h}px"></i>`}return `<span class="wave" aria-hidden="true">${s}</span>`}
const play=`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2l9 5-9 5z" fill="currentColor"/></svg>`;
function bars(list){const max=Math.max(...list.map(x=>x[1]));return `<div class="bars">${list.map(([t,n])=>`<div class="bar"><div class="t"><span>“${t}”</span><span class="track"><i style="width:${Math.round(n/max*100)}%"></i></span></div><span class="n num">${n}×</span></div>`).join('')}</div>`}
function meter(v){return `<span class="meter" aria-label="Prioridade ${v} de 4">${[1,2,3,4].map(i=>`<i class="${i<=v?'on':''}"></i>`).join('')}</span>`}
function matrix(cols,rows,gapCol){
  return `<div class="mwrap"><table class="matrix"><thead><tr><th>Marca</th>${cols.map((c,i)=>`<th class="${i===gapCol?'gap':''}">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.you?'you':''}"><td>${r.n}</td>${r.v.map((v,i)=>`<td class="${i===gapCol?'gap':''}"><span class="dot ${v?'':'no'}" aria-label="${v?'Promete':'Não promete'}"></span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-chan],[data-mis],[data-play],[data-toast]');if(!b)return;
  if(b.dataset.go!==undefined){go(+b.dataset.go);return}
  if(b.dataset.chan){const k=b.dataset.chan;STATE.chan[k]=!(STATE.chan[k]!==false);b.setAttribute('aria-pressed',STATE.chan[k]!==false);b.querySelector('.pick').textContent=STATE.chan[k]!==false?'No plano':'Fora do plano';P.onChan?.();return}
  if(b.dataset.mis){const k=b.dataset.mis;STATE.done[k]=!STATE.done[k];b.setAttribute('aria-pressed',!!STATE.done[k]);P.onMis?.();return}
  if(b.dataset.play){const t=document.getElementById(b.dataset.play);if(t){t.hidden=false;b.closest('.audio').querySelector('.dur').textContent='ouvido'}return}
  if(b.dataset.toast){toast(b.dataset.toast)}
});
$('#prev').addEventListener('click',()=>go(cur-1));
$('#next').addEventListener('click',()=>go(cur===P.screens.length-1?0:cur+1));
document.addEventListener('keydown',e=>{if(e.target.closest('textarea,input'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function fromHash(){const i=P.screens.findIndex(s=>'#'+s.id===location.hash);return i<0?0:i}
window.addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)go(i,true)});
go(fromHash(),true);

</script>

</body></html>
