<style>
/* Layout: a product shell in the Ground channel look. Left rail = the six screens as a route of survey marks; right = the screen at work. Carvão field, Bone stroke, the stroke grammar carries every data state. */
:root{
  --vazio:#0A0A0A; --carvao:#2A2724; --sombra:#6B675D; --duna:#B8B1A2; --piedra:#E0DAC9; --bone:#F2EFE7;
  --field:var(--carvao); --deep:#211F1C; --panel:#33302C; --ink:var(--bone); --label:var(--duna);
  --rule:rgba(242,239,231,.12); --rule-strong:rgba(242,239,231,.3); --hover:rgba(242,239,231,.07);
  --wa:#E7E1D3; --wa-ink:#2A2724;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Montserrat","Segoe UI",Arial,sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--field);color:var(--ink)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--label)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--vazio);border-right:1px solid var(--rule);padding:28px 18px 24px;display:flex;flex-direction:column;gap:26px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:12px;padding:0 6px}

.pname{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.pname small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.22em;color:var(--label);margin-bottom:6px}
.store{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;flex:none;border:1px solid var(--rule-strong)}
.store b{display:block;font-size:13.5px;font-weight:600}
.store span{font-size:12px;color:var(--label)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;background:none;border:0;border-radius:8px;padding:9px 8px;text-align:left;cursor:pointer;color:var(--label)}
.steps button:hover{background:var(--hover)}
.steps button[aria-current="page"]{background:rgba(242,239,231,.1);color:var(--ink)}
.steps .k{font-family:var(--mono);font-size:11px}
.steps .t{font-size:14px;line-height:1.3}
.steps .done .k::after{content:" ✓"}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.demo{display:inline-flex;align-self:flex-start;border:1px dashed var(--rule-strong);border-radius:999px;padding:4px 10px}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule)}
.crumbs{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.crumbs .t{font-family:var(--display);font-weight:600;font-size:15px}
.btn{background:transparent;border:1px solid var(--rule-strong);border-radius:999px;padding:9px 16px;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.solid{background:var(--bone);color:var(--carvao);border-color:var(--bone)}
.btn.solid:hover{background:var(--piedra)}
.btn[disabled]{opacity:.35;cursor:default}
.screen{padding-block:36px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1120px;width:100%;flex:1}
.screen h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.4vw,42px);line-height:1.04;margin:8px 0 10px;text-wrap:balance;letter-spacing:-.005em}
.screen .sub{margin:0 0 28px;color:var(--label);max-width:62ch;font-size:15.5px}
.say{font-family:var(--serif);font-weight:400;font-size:clamp(20px,2.2vw,26px);line-height:1.3;margin:0;text-wrap:balance}
.say.big{font-size:clamp(26px,3vw,38px)}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
.next-row{display:flex;justify-content:flex-end;gap:10px;margin-top:32px}

/* screen 1 */
.connect{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
.conn{display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;padding:22px;border:1px solid var(--rule-strong);border-radius:14px;background:var(--deep);cursor:pointer;color:var(--ink);min-height:180px}
.conn:hover{border-color:var(--bone);background:var(--panel)}
.conn svg{width:40px;height:40px}
.conn b{font-family:var(--display);font-weight:600;font-size:18px}
.conn span{font-size:13.5px;color:var(--label)}
.need{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:13.5px;color:var(--label)}
.need i{font-style:normal;color:var(--ink);font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-radius:6px;padding:2px 8px;margin-right:6px}

/* screen 2 */
.progress{border:1px solid var(--rule);border-radius:12px;padding:20px;background:var(--deep);display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:999px;background:rgba(242,239,231,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-48deg,var(--bone) 0 2px,rgba(242,239,231,.55) 2px 6px);transition:width .25s linear}
.prow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--label);text-align:left;padding:11px 14px;background:rgba(242,239,231,.04)}
td{padding:11px 14px;border-top:1px solid var(--rule)}
td.arrow{color:var(--label);font-family:var(--mono)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule-strong);border-radius:4px;padding:2px 7px;color:var(--ink)}
.tag.off{border-style:dotted;color:var(--sombra)}
.doubt{border:1.5px dashed var(--bone);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--deep)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{border:1px solid var(--rule);border-radius:10px;padding:12px;font-size:13.5px}
.pair b{display:block;font-size:15px;margin-bottom:4px}
.pair .same{color:var(--bone);font-family:var(--mono);font-size:12px}
.pair .dim{color:var(--label)}
.resolved{border-style:solid}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* screen 3 */
.hero3{border-left:2px solid var(--bone);padding-left:20px;margin-bottom:28px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border-top:2px solid var(--bone);padding:14px 4px 4px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(28px,3vw,38px);line-height:1}
.kpi .d{font-size:13px;color:var(--label)}
.chart{margin-top:30px;border:1px solid var(--rule);border-radius:14px;padding:22px;background:var(--deep)}
.chart svg{width:100%;height:auto;display:block}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.legend{display:flex;gap:10px;align-items:flex-start}
.legend i{flex:none;width:26px;height:14px;border-radius:3px;margin-top:4px}
.legend .rent{border:1.5px dashed var(--bone);background:repeating-linear-gradient(-48deg,rgba(242,239,231,.55) 0 1.4px,transparent 1.4px 5px)}
.legend .own{background:var(--bone)}
.legend b{font-family:var(--display);font-weight:800;font-size:22px;display:block;line-height:1.1}

/* screen 4 */
.shock{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.dots{width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:12px;background:var(--deep)}
.sim{border:1px solid var(--rule-strong);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;background:var(--deep)}
.money{font-family:var(--display);font-weight:800;font-size:clamp(40px,5vw,64px);line-height:1;letter-spacing:-.01em}
input[type=range]{width:100%;accent-color:#F2EFE7;height:28px}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--label)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{border-top:1px solid var(--rule);padding-top:8px}
.facts b{display:block;font-family:var(--display);font-size:20px}

/* screen 5 */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grp{border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--deep);min-width:0;position:relative;overflow:hidden}
.grp.fato{border:1.6px solid var(--bone)}
.grp.hip{border:1.6px dashed var(--bone)}
.grp.garg{border:1.6px solid var(--bone)}
.grp.garg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-48deg,rgba(242,239,231,.09) 0 1.5px,transparent 1.5px 9px);pointer-events:none}
.grp.vaz{border:1px dotted var(--sombra);background:transparent}
.grp header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;position:relative}
.grp h3{margin:0;font-family:var(--display);font-weight:600;font-size:19px}
.grp .n{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;position:relative}
.grp .n small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--label);margin-left:6px}
.grp p{margin:0;font-size:14px;color:var(--label);position:relative}
.grp .val{font-family:var(--mono);font-size:13px;color:var(--ink);position:relative}
.gram{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--label)}
.gram span{display:flex;gap:8px;align-items:center}
.gram i{width:22px;height:12px;border-radius:2px}
.gram .a{border:1.5px solid var(--bone)}.gram .b{border:1.5px dashed var(--bone)}
.gram .c{border:1.5px solid var(--bone);background:repeating-linear-gradient(-48deg,var(--bone) 0 1.2px,transparent 1.2px 4px)}.gram .d{border:1px dotted var(--sombra)}

/* screen 6 */
.mission{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:28px;align-items:start}
.mcard{border:1.6px solid var(--bone);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--deep)}
.mcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--label)}
.phone{border:1px solid var(--rule-strong);border-radius:22px;padding:14px;background:#1B1917;display:flex;flex-direction:column;gap:12px}
.phone .ph{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;border-bottom:1px solid var(--rule)}
.phone .ph b{font-size:14px}
.bubble{align-self:flex-end;max-width:92%;background:var(--wa);color:var(--wa-ink);border-radius:14px 14px 4px 14px;padding:4px}
.bubble textarea{display:block;width:100%;min-height:190px;border:0;background:transparent;color:var(--wa-ink);resize:vertical;padding:10px 12px;font-size:14.5px;line-height:1.5}
.bubble textarea:focus{outline:2px solid var(--carvao);border-radius:10px}
.phone .meta{font-family:var(--mono);font-size:10.5px;color:var(--label);text-align:right;letter-spacing:.1em}
.est{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est div{border-top:1px solid var(--rule);padding-top:8px}
.est b{display:block;font-family:var(--display);font-size:22px}
.closing{margin-top:36px;padding:26px 0 0;border-top:1px solid var(--rule)}
.invite{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:22px;font-size:13.5px;color:var(--label)}
.invite a{color:var(--ink);text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--carvao);padding:10px 16px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;z-index:60}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shock,.mission,.cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:16px max(16px,env(safe-area-inset-left,0px));gap:14px;border-right:0;border-bottom:1px solid var(--rule)}
  .brand{flex-direction:row;align-items:center;justify-content:space-between}
  .store,.rail-foot{display:none}
  .steps{flex-direction:row;overflow-x:auto;gap:4px}
  .steps button{grid-template-columns:auto auto;white-space:nowrap}
  .connect,.groups{grid-template-columns:minmax(0,1fr)}
  .topbar,.screen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pair,.facts,.est,.split{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="gmark" role="img" aria-label="Símbolo Ground Project"></span>
      <div class="pname"><small>Ground</small>Marco Zero</div>
    </div>
    <div class="store"><div class="avatar">C</div><div><b>Carla · Fôlego Nutrição</b><span>Suplementos · Nuvemshop</span></div></div>
    <nav aria-label="Telas"><ol class="steps" id="steps"></ol></nav>
    <div class="rail-foot">
      <span class="lbl demo">Demonstração · dados fictícios</span>
      <span class="lbl" style="letter-spacing:.14em">Paid attention → owned ground</span>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="crumbs"><span class="lbl" id="crumbN">01 / 06</span><span class="t" id="crumbT">Conexão</span></div>
      <div style="display:flex;gap:8px"><button class="btn" id="prev" type="button">← Anterior</button><button class="btn solid" id="next" type="button">Próximo →</button></div>
    </div>
    <div id="view" class="screen"></div>
  </main>
</div>
<div id="toastHost"></div>

<script>
const S=[
 {id:'conexao',n:'Conexão'},
 {id:'organizacao',n:'Organização dos dados'},
 {id:'marco-zero',n:'Seu marco zero'},
 {id:'dinheiro-parado',n:'Dinheiro parado'},
 {id:'grupos',n:'Grupos de clientes'},
 {id:'missao',n:'Missão da semana'}
];
const PHRASE1='A venda que você procura já está na sua base.';
const PHRASE2='Em vez de investir mais em anúncio, recupere quem já te conhece. É mais barato e mais rápido.';
const TICKET=150, SUMIDOS=1400;
let cur=0, seen=new Set([0]), progT=null, merged=null, pct=10;
let msg='Oi, [nome]! Aqui é a Carla, da Fôlego. Vi que faz uns 45 dias que você levou o seu whey, então ele deve estar perto do fim.\n\nSeparei o seu sabor de sempre para você não ficar sem. Quer que eu reserve? É só responder aqui que eu te mando o link.';
const brl=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const $=s=>document.querySelector(s);

function steps(){$('#steps').innerHTML=S.map((s,i)=>`<li><button type="button" data-go="${i}" class="${seen.has(i)&&i!==cur?'done':''}" ${i===cur?'aria-current="page"':''}><span class="k">0${i+1}</span><span class="t">${s.n}</span></button></li>`).join('')}

function go(i,fromHash){
  cur=Math.max(0,Math.min(S.length-1,i)); seen.add(cur);
  if(!fromHash&&location.hash!=='#'+S[cur].id){try{history.replaceState(null,'','#'+S[cur].id)}catch(e){location.hash=S[cur].id}}
  $('#crumbN').textContent=`0${cur+1} / 06`; $('#crumbT').textContent=S[cur].n;
  $('#prev').disabled=cur===0; $('#next').textContent=cur===S.length-1?'Recomeçar →':'Próximo →';
  steps(); clearInterval(progT);
  $('#view').innerHTML=[s1,s2,s3,s4,s5,s6][cur]();
  ({1:after2,3:after4,5:after6})[cur]?.();
  window.scrollTo({top:0});
}

/* ---------- 1 ---------- */
function s1(){return `
 <span class="lbl">Bem-vinda, Carla</span>
 <h1>Vamos ler a sua base de clientes.</h1>
 <p class="sub">Conecte a sua loja ou suba uma planilha, mesmo bagunçada. Em poucos minutos você vê quanto da sua receita é alugada e quanto dinheiro está parado na sua base.</p>
 <div class="connect">
  <button class="conn" type="button" data-go="1">${icoStore()}<b>Conectar Nuvemshop</b><span>Pedidos e clientes importados direto da loja.</span></button>
  <button class="conn" type="button" data-go="1">${icoBag()}<b>Conectar Shopify</b><span>Mesma leitura, pela integração da Shopify.</span></button>
  <button class="conn" type="button" data-go="1">${icoSheet()}<b>Subir planilha</b><span>CSV ou Excel, do jeito que estiver. A gente organiza.</span></button>
 </div>
 <div class="need"><span class="lbl" style="width:100%">Só precisamos de três coisas</span><span><i>quem</i>comprou</span><span><i>quando</i>comprou</span><span><i>quanto</i>gastou</span></div>
 <div class="foot"><p class="say">${PHRASE1}</p></div>`}
const icoStore=()=>`<svg viewBox="0 0 40 40" fill="none" stroke="#F2EFE7" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 15 9 7h22l3 8"/><path d="M6 15c0 3 2.5 4.5 4.7 4.5S15.3 18 15.3 15c0 3 2.2 4.5 4.7 4.5s4.7-1.5 4.7-4.5c0 3 2.2 4.5 4.6 4.5S34 18 34 15"/><path d="M9 20v13h22V20"/><path d="M17 33v-7h6v7"/></svg>`;
const icoBag=()=>`<svg viewBox="0 0 40 40" fill="none" stroke="#F2EFE7" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 13h24l-2 21H10z"/><path d="M15 16v-5a5 5 0 0 1 10 0v5"/></svg>`;
const icoSheet=()=>`<svg viewBox="0 0 40 40" fill="none" stroke="#F2EFE7" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 5h14l7 7v23H10z"/><path d="M24 5v7h7"/><path d="M14 19h13M14 24h13M14 29h13M19 17v14"/></svg>`;

/* ---------- 2 ---------- */
function s2(){return `
 <span class="lbl">Organização dos dados</span>
 <h1>A gente arruma a casa. Você só confirma o que ficou em dúvida.</h1>
 <p class="sub">A leitura reconhece as colunas, junta cadastros repetidos e descarta o que não serve para medir recompra.</p>
 <div class="progress"><div class="prow"><span id="pText">Lendo 0 de 3.412 pedidos…</span><span class="lbl" id="pPct">0%</span></div><div class="bar"><i id="pBar"></i></div><div class="prow"><span class="lbl" id="pDup">Cadastros repetidos encontrados: 0</span><span class="lbl">Fonte: Nuvemshop</span></div></div>
 <div class="cols">
  <div><span class="lbl">Colunas reconhecidas</span>
   <div class="tablewrap" style="margin-top:10px"><table>
    <thead><tr><th>Na sua planilha</th><th></th><th>Virou</th></tr></thead>
    <tbody>
     <tr><td>Nome do comprador</td><td class="arrow">→</td><td><span class="tag">Quem</span></td></tr>
     <tr><td>Data do pedido</td><td class="arrow">→</td><td><span class="tag">Quando</span></td></tr>
     <tr><td>Total pago</td><td class="arrow">→</td><td><span class="tag">Quanto</span></td></tr>
     <tr><td>Telefone / E-mail</td><td class="arrow">→</td><td><span class="tag">Contato</span></td></tr>
     <tr><td>Produto</td><td class="arrow">→</td><td><span class="tag">Item</span></td></tr>
     <tr><td>Cupom utilizado</td><td class="arrow">→</td><td><span class="tag">Desconto</span></td></tr>
     <tr><td>Status do frete</td><td class="arrow">→</td><td><span class="tag off">Ignorado</span></td></tr>
    </tbody></table></div>
  </div>
  <div><span class="lbl">Ficou em dúvida</span><div id="doubt" style="margin-top:10px">${doubt()}</div></div>
 </div>
 <div class="next-row"><button class="btn solid" type="button" data-go="2">Ver o meu marco zero →</button></div>`}
function doubt(){
 if(merged===null)return `<div class="doubt"><p class="say" style="font-size:20px">Esses dois cadastros são a mesma cliente?</p>
   <div class="pair"><div><b>Carla S.</b><span class="dim">4 pedidos · último em ago/26</span><br><span class="same">(21) 9 8812-4407</span></div><div><b>Carla Souza</b><span class="dim">1 pedido · set/26</span><br><span class="same">(21) 9 8812-4407</span></div></div>
   <p class="lbl" style="letter-spacing:.12em">Mesmo telefone, nomes diferentes</p>
   <div class="chips"><button class="btn solid" type="button" data-merge="1">Sim, juntar</button><button class="btn" type="button" data-merge="0">Não</button></div></div>`;
 return `<div class="doubt resolved"><p class="say" style="font-size:20px">${merged?'Pronto, virou uma cliente só: 5 pedidos.':'Certo, ficam como duas clientes.'}</p><p style="margin:0;color:var(--label);font-size:14px">Mais 37 cadastros repetidos foram unidos sozinhos, porque tinham o mesmo e-mail e o mesmo telefone.</p><div class="chips"><button class="btn" type="button" data-merge="reset">Desfazer</button></div></div>`}
function after2(){
 let n=0;const tot=3412;
 progT=setInterval(()=>{n=Math.min(tot,n+Math.ceil(tot/28));const p=Math.round(n/tot*100);const t=$('#pText');if(!t){clearInterval(progT);return}
  t.textContent=n<tot?`Lendo ${n.toLocaleString('pt-BR')} de 3.412 pedidos…`:'3.412 pedidos lidos · 2.000 clientes únicas';
  $('#pPct').textContent=p+'%';$('#pBar').style.width=p+'%';$('#pDup').textContent='Cadastros repetidos encontrados: '+Math.round(38*n/tot);
  if(n>=tot)clearInterval(progT)},110);
}

/* ---------- 3 ---------- */
const MONTHS=[['jun',41],['jul',44],['ago',52],['set',47],['out',58],['nov',63]]; // receita mensal em R$ mil
const NEWSH=[.66,.69,.72,.68,.71,.73];
function s3(){
 return `
 <div class="hero3"><span class="lbl">Seu marco zero · últimos 6 meses</span><p class="say big" style="margin-top:8px">${PHRASE1}</p></div>
 <div class="kpis">
  <div class="kpi"><span class="lbl">Clientes na base</span><span class="v num">2.000</span><span class="d">3.412 pedidos desde 2024</span></div>
  <div class="kpi"><span class="lbl">Taxa de recompra</span><span class="v num">18%</span><span class="d">360 clientes compraram mais de uma vez</span></div>
  <div class="kpi"><span class="lbl">Até a 2ª compra</span><span class="v num">52 dias</span><span class="d">Tempo médio entre o 1º e o 2º pedido</span></div>
  <div class="kpi"><span class="lbl">LTV médio</span><span class="v num">R$ 209</span><span class="d">Quanto cada cliente gastou, somando tudo</span></div>
 </div>
 <div class="chart">
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline"><span class="lbl">Receita por mês · R$ mil</span><span class="lbl" style="letter-spacing:.12em">Hachura tracejada = cliente nova · sólido = cliente que voltou</span></div>
  ${chart()}
  <div class="split">
   <div class="legend"><i class="rent"></i><div><b class="num">70%</b><span>da receita vem de cliente nova. É o crescimento alugado: depende de anúncio para continuar.</span></div></div>
   <div class="legend"><i class="own"></i><div><b class="num">30%</b><span>vem de quem voltou. É o crescimento construído, o terreno que já é seu.</span></div></div>
  </div>
 </div>
 <div class="next-row"><button class="btn solid" type="button" data-go="3">Ver o dinheiro parado →</button></div>`}
function chart(){
 const W=860,H=300,x0=56,y0=24,ch=220,max=70,bw=74,gap=(W-x0-24-6*bw)/5;
 const Y=v=>y0+ch-(v/max)*ch;
 let g='';
 [0,20,40,60].forEach(t=>{g+=`<line x1="${x0}" x2="${W-16}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(242,239,231,.1)"/><text x="${x0-10}" y="${Y(t)+4}" text-anchor="end" fill="#B8B1A2" font-family="IBM Plex Mono,monospace" font-size="11">${t}</text>`});
 MONTHS.forEach(([m,v],i)=>{const x=x0+i*(bw+gap),nv=v*NEWSH[i],ov=v-nv;
  g+=`<rect x="${x}" y="${Y(ov)}" width="${bw}" height="${ch-(Y(ov)-y0)}" fill="#F2EFE7" rx="2"/>`;
  g+=`<rect x="${x+.8}" y="${Y(v)+.8}" width="${bw-1.6}" height="${Y(ov)-Y(v)-2.6}" fill="url(#hatch)" stroke="#F2EFE7" stroke-width="1.4" stroke-dasharray="5 4" rx="2"/>`;
  g+=`<text x="${x+bw/2}" y="${Y(v)-8}" text-anchor="middle" fill="#F2EFE7" font-family="Archivo,Arial" font-weight="600" font-size="13">${v}</text>`;
  g+=`<text x="${x+bw/2}" y="${y0+ch+20}" text-anchor="middle" fill="#B8B1A2" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5">${m.toUpperCase()}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receita mensal de junho a novembro, cerca de 70% de clientes novas"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-48)"><line x1="0" y1="0" x2="0" y2="7" stroke="rgba(242,239,231,.55)" stroke-width="1.4"/></pattern></defs>${g}</svg>`}

/* ---------- 4 ---------- */
function s4(){return `
 <span class="lbl">Dinheiro parado</span>
 <h1><span class="num">1.400</span> clientes compraram uma vez e sumiram.</h1>
 <p class="sub">Cada uma já conhece a Fôlego, já confiou e já pagou. Ticket médio da primeira compra: R$ 150.</p>
 <div class="shock">
  <div><canvas id="dots" class="dots" width="760" height="460" aria-label="1.400 quadrados, um por cliente; os destacados são as que voltariam"></canvas><p class="lbl" style="margin-top:10px;letter-spacing:.12em">Cada quadrado é uma cliente · em destaque, as que voltariam</p></div>
  <div class="sim">
   <span class="lbl">Se <span id="pv">10</span>% voltarem</span>
   <div class="money num" id="mv">R$ 21.000</div>
   <p style="margin:0;color:var(--label)">a mais em receita, sem precisar de uma cliente nova.</p>
   <label class="lbl" for="pct" style="letter-spacing:.12em">Arraste para simular o retorno</label>
   <input id="pct" type="range" min="1" max="40" step="1" value="${pct}">
   <div class="scale"><span>1%</span><span>10%</span><span>20%</span><span>30%</span><span>40%</span></div>
   <div class="facts"><div><span class="lbl">Clientes que voltam</span><b class="num" id="cv">140</b></div><div><span class="lbl">Por mês, em 6 meses</span><b class="num" id="pm">R$ 3.500</b></div></div>
  </div>
 </div>
 <div class="foot"><p class="say">${PHRASE2}</p><button class="btn solid" type="button" data-go="4">Ver os grupos →</button></div>`}
function after4(){const r=$('#pct');r.addEventListener('input',()=>{pct=+r.value;upd4()});upd4()}
function upd4(){
 const back=Math.round(SUMIDOS*pct/100),v=back*TICKET;
 $('#pv').textContent=pct;$('#mv').textContent=brl(v);$('#cv').textContent=back.toLocaleString('pt-BR');$('#pm').textContent=brl(v/6);
 const c=$('#dots'),x=c.getContext('2d'),cols=50,rows=28,pad=18,s=(c.width-pad*2)/cols;
 x.clearRect(0,0,c.width,c.height);
 for(let i=0;i<SUMIDOS;i++){const cx=pad+(i%cols)*s,cy=pad+Math.floor(i/cols)*s+2;
  // spread the returning ones evenly, not as a block
  const on=((i*977)%SUMIDOS)<back;
  if(on){x.fillStyle='#F2EFE7';x.fillRect(cx+2,cy+2,s-5,s-5)}
  else{x.strokeStyle='rgba(184,177,162,.45)';x.lineWidth=1;x.setLineDash([2,2]);x.strokeRect(cx+2.5,cy+2.5,s-6,s-6);x.setLineDash([])}}
}
